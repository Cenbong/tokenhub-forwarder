app = "tokenhub-forwarder"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 3000
  processes = ["app"]

  [[services.ports]]
    port = 443
    handlers = ["tls"]
    force_https = true

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.concurrency]]
    type = "connections"
    hard_limit = 25
    soft_limit = 20